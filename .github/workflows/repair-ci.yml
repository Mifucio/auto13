name: Repair branch structural validation

on:
  push:
    branches:
      - 'fix/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structural-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Compile test harness
        run: ./gradlew --no-daemon compileTestJava

      - name: Validate all Cucumber bindings without live execution
        run: ./gradlew --no-daemon test -Dcucumber.execution.dry-run=true
